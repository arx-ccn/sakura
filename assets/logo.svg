<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Single stylized sakura petal, pointing up, base near origin, notched tip -->
    <path id="petal"
      d="M 0 -36
         C -40 -52, -62 -104, -54 -152
         C -49 -180, -29 -196, -13 -186
         C -6 -181, -2 -172, 0 -162
         C 2 -172, 6 -181, 13 -186
         C 29 -196, 49 -180, 54 -152
         C 62 -104, 40 -52, 0 -36
         Z"/>
  </defs>

  <!-- dark neutral rounded-square badge -->
  <rect x="0" y="0" width="1024" height="1024" rx="84" fill="#17171c"/>

  <!-- blossom: five petals, flat soft pink -->
  <g transform="translate(512 432) scale(1.38)">
    <g fill="#f5a8c0">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
    <!-- minimal stamen center -->
    <circle r="12" fill="#d4778f"/>
    <g fill="#d4778f">
      <circle cx="0" cy="-44" r="7"/>
      <circle cx="41.8" cy="-13.6" r="7"/>
      <circle cx="25.9" cy="35.6" r="7"/>
      <circle cx="-25.9" cy="35.6" r="7"/>
      <circle cx="-41.8" cy="-13.6" r="7"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="512" y="828"
        font-family="JetBrainsMono Nerd Font"
        font-size="108" font-weight="500"
        letter-spacing="10"
        text-anchor="middle"
        fill="#e9e7e4">sakura</text>
</svg>
